<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Archers</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="settings" class="hidden">
  <h1>STICK ARCHERS</h1>
  <div id="rows" class="rows"></div>
  <div id="damage" class="damage"></div>
  <div class="hint">Controller: tap LT = next setting &nbsp;·&nbsp; tap RT = change it &nbsp;·&nbsp; hold LT + RT = continue
    &nbsp;&nbsp;(keyboard: A / D, or ← / →)</div>
  <button id="continue">Continue</button>
</div>
<button id="toSettings" class="hidden">&#9881; Settings</button>
<div id="soundHint" class="hidden">Click anywhere or press a key to turn on sound</div>
<!-- config/damage.js is a plain script so a typo in it can't stop the game from loading -->
<script src="config/damage.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
